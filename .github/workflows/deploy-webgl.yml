name: Build & Deploy WebGL

# Manual Unity WebGL build. This workflow does not run on push.
# A person dispatches it from the Actions tab after the license secrets exist.
# See QUAHOG_Unity/WEBGL.md. Dispatching it builds on GitHub-hosted runners and
# publishes the player to the gh-pages branch.
#
# Requires repo secrets:
#   UNITY_EMAIL, UNITY_PASSWORD, and exactly one of:
#     UNITY_LICENSE  — contents of your .ulf file (personal/free license)
#     UNITY_SERIAL   — your Pro/Plus serial number
# Setting both makes game-ci follow the serial. A bad serial fails with
# licensing code 20110 even when the .ulf would have worked.

on:
  workflow_dispatch:

concurrency:
  group: webgl-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build WebGL and publish to Pages
    runs-on: ubuntu-latest
    permissions:
      contents: write   # lets the deploy step push to gh-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: QUAHOG_Unity/Library
          key: Library-WebGL-${{ hashFiles('QUAHOG_Unity/Assets/**', 'QUAHOG_Unity/Packages/**', 'QUAHOG_Unity/ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-
            Library-

      - name: Require Unity license secrets
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          if [ -z "${UNITY_EMAIL}" ] || [ -z "${UNITY_PASSWORD}" ]; then
            echo "UNITY_EMAIL and UNITY_PASSWORD must be set. See QUAHOG_Unity/WEBGL.md"
            exit 1
          fi
          if [ -n "${UNITY_LICENSE}" ] && [ -n "${UNITY_SERIAL}" ]; then
            echo "Both UNITY_LICENSE and UNITY_SERIAL are set."
            echo "game-ci uses the serial whenever UNITY_SERIAL is non-empty."
            echo "A bad serial fails with licensing code 20110."
            echo "Personal license: delete the UNITY_SERIAL secret and keep UNITY_LICENSE as the full .ulf."
            exit 1
          fi
          if [ -z "${UNITY_LICENSE}" ] && [ -z "${UNITY_SERIAL}" ]; then
            echo "Set UNITY_LICENSE (personal .ulf contents) or UNITY_SERIAL (Pro/Plus)."
            echo "See QUAHOG_Unity/WEBGL.md"
            exit 1
          fi

      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: QUAHOG_Unity
          targetPlatform: WebGL
          unityVersion: 6000.0.23f1

      - name: Locate built player
        id: loc
        run: |
          dir="$(dirname "$(find build -name index.html | head -n1)")"
          echo "Found WebGL player at: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ${{ steps.loc.outputs.dir }}
          force_orphan: true
